name: Database Checks

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    paths:
      - "database/**"

defaults:
  run:
    working-directory: database

jobs:
  test-type-generation:
    name: Supabase Type Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node LTS ✨
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: frontend/package.json
          node-version: lts/*

      - name: Installing dependencies 📦️
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      - name: Verify generated types
        run: |
          pnpm run gen:types
          if ! git diff --ignore-space-at-eol --exit-code --quiet database.types.ts; then
            echo "Detected uncommitted changes after build. Run genTypes.sh and commit the result. See status below:"
            git diff
            exit 1
          fi
