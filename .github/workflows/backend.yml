name: Backend Checks

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  test-type-generation:
    name: Supabase Type Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: supabase start
      - name: Verify generated types
        env:
          TYPES_PATH: database.types.ts
        run: |
          supabase gen types typescript --local > $TYPES_PATH
          if ! git diff --ignore-space-at-eol --exit-code --quiet $TYPES_PATH; then
            echo "Detected uncommitted changes after build. Run genTypes.sh and commit the result. See status below:"
            git diff
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node LTS ✨
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: backend
          node-version: lts/*

      - name: Installing dependencies 📦️
        run: npm ci

      - name: Lint 🛀
        run: npm run lint

      - name: Format 🧹
        run: npm run format

      - name: Commit changes if any
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          if output=$(git status --porcelain) && [ ! -z "$output" ]; then
            git commit -m "style: Automatic code formatting" -a
            git push
          fi
